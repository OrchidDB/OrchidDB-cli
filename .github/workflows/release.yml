name: Build CLI release
run-name: cli ${{ inputs.request_id }} ${{ inputs.tag }} ${{ inputs.platform }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag to build
        required: true
        type: string
      platform:
        description: Build only this platform; completed platforms are retained
        type: choice
        default: all
        options:
        - all
        - linux-x86_64
        - macos-aarch64
        - macos-x86_64
      request_id:
        description: Coordinator id for safe resume and dispatch recovery
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cli-${{ inputs.tag }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux-x86_64' && '[{"os":"ubuntu-22.04","platform":"linux-x86_64"}]' || inputs.platform == 'macos-aarch64'
          && '[{"os":"macos-14","platform":"macos-aarch64"}]' || inputs.platform == 'macos-x86_64' && '[{"os":"macos-15-intel","platform":"macos-x86_64"}]'
          || '[{"os":"ubuntu-22.04","platform":"linux-x86_64"},{"os":"macos-14","platform":"macos-aarch64"},{"os":"macos-15-intel","platform":"macos-x86_64"}]')
          }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_TAG: ${{ inputs.tag }}
      PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
        path: client
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        path: automation
    - uses: dtolnay/rust-toolchain@1.93.1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate release version
      run: python -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: client
        shared-key: release-cli-${{ matrix.platform }}
        cache-on-failure: true
    - name: Build standalone CLI with pinned static DuckDB
      run: python ../automation/scripts/release/build.py --source . --platform "$PLATFORM"
    - name: Package executable
      run: |
        mkdir -p dist/package
        cp target/release/orchiddb target/release/BUILD.json LICENSE.md README.md dist/package/
        cp -R examples dist/package/
        tar -czf "dist/orchiddb-${RELEASE_TAG}-${PLATFORM}.tar.gz" -C dist/package .
        rm -rf dist/package
        git rev-parse HEAD > dist/SOURCE_COMMIT
    - uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.platform }}
        path: client/dist/*
        if-no-files-found: error
        overwrite: true
        retention-days: 30
