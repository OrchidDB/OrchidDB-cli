[package]
name = "orchiddb-cli"
version = "0.1.0"
edition = "2024"
description = "OrchidDB graph query CLI with DuckDB and Iceberg"
license = "GPL-3.0-only"
repository = "https://github.com/OrchidDB/OrchidDB-cli"
publish = false

[[bin]]
name = "orchiddb"
path = "src/main.rs"

[features]
default = ["bundled"]
bundled = ["duckdb/bundled"]

[dependencies]
orchiddb-client = { git = "https://github.com/OrchidDB/OrchidDB-rust.git", rev = "77b2f23a65470c7d118deba94f6739b510634fe2", default-features = false }
duckdb = "=1.10502.0"
arrow = { version = "58.2.0", features = ["ipc", "prettyprint"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
